name: CI / Deploy

# Runs on every push to master: build + test → push image to GHCR → deploy to Fly.io
# Also triggerable manually: gh workflow run deploy.yml
on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/avidj/foundry-server

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # allows GITHUB_TOKEN to push to GHCR (no PAT needed)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven  # caches ~/.m2 between runs keyed on pom.xml hash

      # Build foundry-server and all modules it depends on (-am); fail fast before touching Docker
      - name: Build and test
        run: mvn verify -pl foundry-server -am -q

      # GITHUB_TOKEN is auto-generated per run; packages:write permission above grants GHCR access
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build context is repo root so the Dockerfile can COPY from multiple modules.
      # Tags both :latest and :<sha> — sha tag is what we deploy (immutable), latest is for humans.
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: foundry-server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Deploys the sha-tagged image — avoids any ambiguity about which build :latest points to.
      # FLY_API_TOKEN: generate with 'flyctl tokens create deploy -x 999999h', store in repo secrets.
      - name: Deploy to Fly.io
        run: flyctl deploy --image ${{ env.IMAGE }}:${{ github.sha }} --app foundry-server
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
